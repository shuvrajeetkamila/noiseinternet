# NOISE INTERNET - CI that produces the platform artifacts.
#
# Why this exists: the sandbox where this code was written has no JDK, no Android SDK, no NDK and no
# MSVC, so `android/` and `windows/` were source-only forever and reports/RESULTS.md gate G said FAIL
# with "no artifact exists". These jobs are the smallest thing that can turn that into a real, downloaded
# binary plus a build log that cannot be argued with. Nothing here publishes a result the code has not
# earned: the jobs build, they run the unit tests where a host toolchain exists, and the artifact job
# uploads exactly what the compiler produced. A failed compile is a failed run, not a skipped step.
name: build-artifacts

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: 'create a GitHub Release containing the APK and the EXE'
        type: boolean
        default: true
  push:
    branches: [main, 'arena/**']
  pull_request:

env:
  ANDROID_NDK: 26.1.10909125
  ANDROID_BUILD_TOOLS: 34.0.0
  ANDROID_PLATFORM: android-34
  GRADLE_VERSION: 8.9

jobs:
  # ---------------------------------------------------------------- Linux: the shared core and its tests
  core-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install cmake
        run: sudo apt-get update && sudo apt-get install -y cmake
      - name: Configure and build the shared core with tests
        run: |
          cmake -S shared/acoustic_core -B build-linux \
            -DCMAKE_BUILD_TYPE=Release -DNI_BUILD_TESTS=ON -DNI_BUILD_SHARED=ON
          cmake --build build-linux -j 3
      - name: Unit tests (no audio hardware involved; these are the same targets ctest runs locally)
        working-directory: build-linux
        run: ctest --output-on-failure
      - name: "Environment audit (prints the truth about this host: 0 audio devices)"
        run: ./build-linux/ni audit
      - name: One simulated-session transfer, so the published claim is reproducible from CI logs
        run: |
          ./build-linux/ni linksim --bytes 2048 --profile 11 --trials 1 --max-ms 60000 \
            --snr 25 --no-multipath | tee linksim-ci.txt
      - uses: actions/upload-artifact@v4
        with:
          name: linksim-linux-record
          path: linksim-ci.txt

  # ---------------------------------------------------------------- Android: debug APK (with native core)
  android:
    runs-on: ubuntu-latest
    needs: core-linux          # the APK compiles the same core; do not ship it if that does not build
    permissions:
      contents: write          # only used to post the failure transcript as a commit comment
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}
      # One step for the whole native+Kotlin build, with the transcript kept in a file: the annotator
      # step below can then publish the first errors as check annotations. That is not decoration -
      # this project is developed from a sandbox that can read the Actions API but cannot follow the
      # redirect to the log host, so without annotations a CI failure is literally unreadable here.
      - name: Install SDK packages and assemble the debug APK
        run: |
          set +e
          {
            echo "::group::sdkmanager"
            yes | sdkmanager --licenses >/dev/null 2>&1
            sdkmanager --install \
              "platforms;${ANDROID_PLATFORM}" "build-tools;${ANDROID_BUILD_TOOLS}" \
              "ndk;${ANDROID_NDK}" "cmake;3.22.1"
            echo "sdkmanager rc=$?"
            echo "::endgroup::"
            echo "::group::gradle"
            (cd android && gradle :app:assembleDebug --no-daemon --stacktrace --warning-mode=all)
            echo "gradle rc=$?"
            exit 0
          } 2>&1 | tee android.log
          grep -q "gradle rc=0" android.log || exit 1
          apk=$(find android -name '*-debug*.apk' | head -1)
          test -n "$apk" || { echo "gradle said OK but no APK exists"; exit 1; }
          cp "$apk" noiseinternet-debug.apk
          echo "apk: noiseinternet-debug.apk ($(stat -c %s noiseinternet-debug.apk) bytes)"
          unzip -l noiseinternet-debug.apk | sed -n '1,30p'
          unzip -l noiseinternet-debug.apk | grep -qE 'lib/(arm64-v8a|x86_64)/libnoiseinternet_jni.so' \
            || { echo "APK contains no native core - that is a build failure, not a success"; exit 1; }
        env:
          ANDROID_PLATFORM: ${{ env.ANDROID_PLATFORM }}
          ANDROID_BUILD_TOOLS: ${{ env.ANDROID_BUILD_TOOLS }}
          ANDROID_NDK: ${{ env.ANDROID_NDK }}
      - name: Report what failed where it can be read
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          {
            echo "## android build failed (CI)"
            echo '```'
            if [ -f android.log ]; then
              grep -nE "(error:|^e: |FAILURE:|What went wrong|CMake Error|Could not|not found|undefined reference|FAILED|No such file|command not found)" android.log | head -25
              echo "--- tail ---"
              tail -15 android.log
            else
              echo "no android.log: the job died before the build step ran"
            fi
            echo '```'
          } > report.md
          sed -i 's/\r//g' report.md
          echo "--- report ---"; cat report.md
          curl -sS -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            --data "$(python3 -c "import json;print(json.dumps({'body':open('report.md').read()}))")" \
            -o /dev/null -w "comment http %{http_code}\n" || true
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: android-debug-apk
          path: noiseinternet-debug.apk
          if-no-files-found: error

  # ---------------------------------------------------------------- Windows: WASAPI host and the console app
  windows:
    runs-on: windows-latest
    permissions:
      contents: write          # only used to post the failure transcript as a commit comment
    steps:
      - uses: actions/checkout@v4
      - name: Configure and build with MSVC
        shell: pwsh
        run: |
          cmake -S windows -B build-windows *> cfg.log
          if ($LASTEXITCODE -ne 0) { Get-Content cfg.log; exit 2 }
          cmake --build build-windows --config Release -j 2 -- /v:minimal *> build.log
          if ($LASTEXITCODE -ne 0) { Get-Content build.log; exit 3 }
          $exe = Get-ChildItem -Path build-windows -Recurse -Filter NoiseInternet.exe | Select-Object -First 1
          if (-not $exe) { Write-Host "configure+build succeeded but no NoiseInternet.exe exists"; exit 4 }
          Write-Host "exe: $($exe.FullName) ($($exe.Length) bytes)"
          Copy-Item $exe.FullName NoiseInternet.exe
      - name: Report what failed where it can be read
        if: failure()
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $body = "## windows build failed (CI)`n`n``````"
          foreach ($f in @('cfg.log','build.log')) {
            if (Test-Path $f) {
              $hits = Select-String -Path $f -Pattern 'error|CMake Error|FATAL|unresolved|not found' |
                Select-Object -First 14 | ForEach-Object { $_.Line }
              $tail = Get-Content $f -Tail 10
              $body += "`n--- $f ---`n" + ($hits -join "`n") + "`n[tail]`n" + ($tail -join "`n")
            }
          }
          if ($body -notmatch '---') { $body += "`nno build logs: the job died before the build step" }
          $body += "`n``````"
          $json = @{ body = $body } | ConvertTo-Json -Compress
          Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" `
            -Headers @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" } `
            -Body $json | Out-Null
          Write-Host "posted commit comment"
          Write-Host $body
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: windows-noiseinternet-exe
          path: NoiseInternet.exe
          if-no-files-found: error

  # ---------------------------------------------------------------- publish, only if everything above is green
  release:
    if: github.event_name == 'workflow_dispatch' && inputs.publish_release
    runs-on: ubuntu-latest
    needs: [core-linux, android, windows]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: '*'
      - name: Publish the CI build as a pre-release (debug-signed APK, unsigned EXE - nothing more)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ci-build
          prerelease: true
          generate_release_notes: false
          name: "CI build ${{ github.sha }}"
          body: |
            Built by `.github/workflows/build.yml` from `${{ github.sha }}`. This is NOT a release of a
            working product: the acoustic link has no verified over-the-air transfer (see
            `docs/STATUS.md` gates C/E/F/G), the APK is signed with a throwaway *debug* keystore created
            on the runner, and the EXE is unsigned and will trip SmartScreen.
            The build log on the run page is the evidence; the files are what the compiler produced.
          files: |
            **/*.apk
            **/NoiseInternet.exe
